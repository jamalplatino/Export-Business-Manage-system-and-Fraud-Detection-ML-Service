{% extends "base.html" %}

{% block title %}Customers{% endblock %}

{% block content %}
<h1>Customers</h1>
<p><a class="btn" href="{% url 'customer_create' %}">+ New customer</a></p>

<table>
    <thead>
        <tr>
            <th>Name</th><th>Email</th><th>Country</th><th>Created</th>
        </tr>
    </thead>
    <tbody>
        {% for c in customers %}
        <tr>
            <td><a href="{% url 'customer_detail' c.pk %}">{{ c.name }}</a></td>
            <td>{{ c.email }}</td>
            <td>{{ c.country }}</td>
            <td>{{ c.created_at|date:"Y-m-d" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No customers yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
