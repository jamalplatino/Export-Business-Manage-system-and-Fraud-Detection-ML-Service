{% extends "base.html" %}

{% block title %}{{ action }} Payment{% endblock %}

{% block content %}
<h1>{{ action }} Payment</h1>

<form method="post">
    {% csrf_token %}

    <p>
        <label>Invoice *<br>
        <select name="invoice" required style="width:100%;padding:8px;">
            <option value="">— choose an invoice —</option>
            {% for i in invoices %}
                <option value="{{ i.pk }}">{{ i.number }} — {{ i.customer.name }}</option>
            {% endfor %}
        </select></label>
    </p>

    <p>
        <label>Amount *<br>
        <input type="number" step="0.01" name="amount" required style="width:100%;padding:8px;"></label>
    </p>

    <p>
        <label>Method *<br>
        <select name="method" required style="width:100%;padding:8px;">
            <option value="">— choose a method —</option>
            {% for value, label in method_choices %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select></label>
    </p>

    <p>
        <label>Reference *<br>
        <input type="text" name="reference" required style="width:100%;padding:8px;"></label>
    </p>

    <p>
        <label>Paid at *<br>
        <input type="datetime-local" name="paid_at" required style="width:100%;padding:8px;"></label>
    </p>

    <button class="btn" type="submit">Save</button>
    <a href="{% url 'payment_list' %}">Cancel</a>
</form>
{% endblock %}
