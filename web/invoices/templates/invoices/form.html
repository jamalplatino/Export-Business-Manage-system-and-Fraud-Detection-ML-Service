{% extends "base.html" %}

{% block title %}{{ action }} Invoice{% endblock %}

{% block content %}
<h1>{{ action }} Invoice</h1>

<form method="post">
    {% csrf_token %}

    <p>
        <label>Customer *<br>
        <select name="customer" required style="width:100%;padding:8px;">
            <option value="">— choose a customer —</option>
            {% for c in customers %}
                <option value="{{ c.pk }}">{{ c.name }}</option>
            {% endfor %}
        </select></label>
    </p>

    <p>
        <label>Invoice number *<br>
        <input type="text" name="number" required style="width:100%;padding:8px;"></label>
    </p>

    <p>
        <label>Amount *<br>
        <input type="number" step="0.01" name="amount" required style="width:100%;padding:8px;"></label>
    </p>

    <p>
        <label>Currency<br>
        <input type="text" name="currency" value="USD" style="width:100%;padding:8px;"></label>
    </p>

    <p>
        <label>Status<br>
        <select name="status" style="width:100%;padding:8px;">
            {% for value, label in status_choices %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select></label>
    </p>

    <p>
        <label>Issued date *<br>
        <input type="date" name="issued_date" required style="width:100%;padding:8px;"></label>
    </p>

    <p>
        <label>Due date *<br>
        <input type="date" name="due_date" required style="width:100%;padding:8px;"></label>
    </p>

    <button class="btn" type="submit">Save</button>
    <a href="{% url 'invoice_list' %}">Cancel</a>
</form>
{% endblock %}
