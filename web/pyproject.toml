[project]
name = "export-billing-web"
version = "0.1.0"
description = "Django web application"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.1",
    "django-celery-beat>=2.1.0",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false