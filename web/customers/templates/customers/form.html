{% extends "base.html" %}

{% block title %}{{ action }} Customer{% endblock %}

{% block content %}
<h1>{{ action }} Customer</h1>

<form method="post">
    {% csrf_token %}
    <p>
        <label>Name *<br>
        <input type="text" name="name" required style="width:100%;padding:8px;"></label>
    </p>
    <p>
        <label>Email *<br>
        <input type="email" name="email" required style="width:100%;padding:8px;"></label>
    </p>
    <p>
        <label>Phone<br>
        <input type="text" name="phone" style="width:100%;padding:8px;"></label>
    </p>
    <p>
        <label>Country *<br>
        <input type="text" name="country" required style="width:100%;padding:8px;"></label>
    </p>
    <button class="btn" type="submit">Save</button>
    <a href="{% url 'customer_list' %}">Cancel</a>
</form>
{% endblock %}
