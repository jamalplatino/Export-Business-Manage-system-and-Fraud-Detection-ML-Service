{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
<h1>Your Profile</h1>

<table>
    <tr><th>Username</th><td>{{ user.username }}</td></tr>
    <tr><th>Email</th><td>{{ user.email }}</td></tr>
    <tr><th>Role</th><td>{{ user.profile.get_role_display }}</td></tr>
    <tr><th>Joined</th><td>{{ user.date_joined|date:"Y-m-d" }}</td></tr>
</table>
{% endblock %}
