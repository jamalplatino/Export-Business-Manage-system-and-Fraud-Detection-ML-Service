{% extends "base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
<h1>Sign up</h1>

<form method="post">
    {% csrf_token %}
    <p>
        <label>Username *<br>
        <input type="text" name="username" required style="width:100%;padding:8px;"></label>
    </p>
    <p>
        <label>Email *<br>
        <input type="email" name="email" required style="width:100%;padding:8px;"></label>
    </p>
    <p>
        <label>Password *<br>
        <input type="password" name="password" required style="width:100%;padding:8px;"></label>
    </p>
    <p>
        <label>Confirm Password *<br>
        <input type="password" name="password2" required style="width:100%;padding:8px;"></label>
    </p>
    <button class="btn" type="submit">Create account</button>
</form>

<p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
